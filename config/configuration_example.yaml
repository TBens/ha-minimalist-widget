# ====================================
# 🌈 HA Minimalist Widget - Configuration
# ====================================
# Copy this configuration into your configuration.yaml
# Adapt entity names according to your installation
# ⚠️ Don't forget to restart Home Assistant after modification

# ====================================
# 📝 Template Sensors
# ====================================

template:
  # ====================================
  # Sensor: Tasks for Today
  # ====================================
  # Counts only tasks to do today
  # (includes today's tasks + overdue + no date)
  
  - trigger:
      # 🔁 Update every 10 minutes
      - platform: time_pattern
        minutes: "/10"
      # 🔁 Update on HA startup
      - platform: homeassistant
        event: start
      # 🔁 Manual update (reload templates)
      - platform: event
        event_type: event_template_reloaded
      # 🔁 Update when a task changes
      - platform: state
        entity_id: todo.your_task_list  # ← ADAPT THIS with your entity
    action:
      # 📝 Get all active tasks
      - service: todo.get_items
        target:
          entity_id: todo.your_task_list  # ← ADAPT THIS with your entity
        data:
          status: needs_action
        response_variable: tasks_data
    sensor:
      - name: "Tâches aujourd'hui"
        unique_id: "tasks_today_count"
        icon: mdi:checkbox-marked-circle-outline
        state: >-
          {% set tasks = tasks_data['todo.your_task_list']['items'] if 'todo.your_task_list' in tasks_data else [] %}
          {% set today = now().date() | string %}
          {% set count = namespace(value=0) %}
          {% for task in tasks %}
            {% if task.due is not defined or task.due is none or task.due <= today %}
              {% set count.value = count.value + 1 %}
            {% endif %}
          {% endfor %}
          {{ count.value }}

  # ====================================
  # Sensor: Remaining Events Today
  # ====================================
  # Counts upcoming events (from now until midnight)
  # You can add multiple calendars
  
  - trigger:
      # 🔁 Update every 10 minutes
      - platform: time_pattern
        minutes: "/10"
      # 🔁 Manual update (reload templates)
      - platform: event
        event_type: event_template_reloaded
    action:
      # 📅 Get calendar events
      - service: calendar.get_events
        target:
          entity_id:
            - calendar.your_calendar_1  # ← ADAPT THIS
            # - calendar.your_calendar_2  # ← Add more calendars if needed
        data:
          start_date_time: "{{ now() }}"
          end_date_time: "{{ today_at('23:59:59') }}"
        response_variable: agenda
    sensor:
      - name: "Events Today"
        unique_id: "events_today_remaining"
        icon: mdi:calendar-clock
        state: >-
          {% set ag = agenda | default({}, true) %}
          {% set ev1 = ag['calendar.your_calendar_1']['events'] if 'calendar.your_calendar_1' in ag else [] %}
          {# Uncomment if you have a 2nd calendar #}
          {# {% set ev2 = ag['calendar.your_calendar_2']['events'] if 'calendar.your_calendar_2' in ag else [] %} #}
          {% set ev_all = ev1 %}  {# If multiple calendars: ev1 + ev2 #}
          {{ ev_all | length }}
        attributes:
          # 📌 Next event title
          next_event_title: >-
            {% set ag = agenda | default({}, true) %}
            {% set ev1 = ag['calendar.your_calendar_1']['events'] if 'calendar.your_calendar_1' in ag else [] %}
            {% set ev_all = ev1 | sort(attribute='start') %}
            {{ (ev_all[0].summary if ev_all|length > 0 else '') }}
          # 🕐 Next event time
          next_event_time: >-
            {% set ag = agenda | default({}, true) %}
            {% set ev1 = ag['calendar.your_calendar_1']['events'] if 'calendar.your_calendar_1' in ag else [] %}
            {% set ev_all = ev1 | sort(attribute='start') %}
            {% if ev_all|length > 0 %}
              {% set ts = as_timestamp(ev_all[0].start) %}
              {{ (as_datetime(ts)|as_local).strftime('%H:%M') }}
            {% else %}
              {{ '' }}
            {% endif %}

# ====================================
# 📋 Required Entities for Widget
# ====================================
# These entities must exist in your Home Assistant.
# Adapt names in the widget template.
#
# ✅ Created by this config:
#   - sensor.taches_aujourd_hui
#   - sensor.events_today
#
# 📱 To configure via Companion App:
#   - sensor.YOUR_sleep_duration       (Sleep duration)
#   - sensor.YOUR_daily_steps          (Step count)
#
# ⚡ To configure via energy integration:
#   - sensor.YOUR_power_consumption    (Power consumption)
#
# 🎂 (Optional) Birthday calendar:
#   - calendar.your_birthdays
#
# ====================================
# 🔧 After Installation
# ====================================
# 1. Replace all "your_..." with your real entities
# 2. Restart Home Assistant
# 3. Verify that sensor.taches_aujourd_hui and sensor.events_today appear
# 4. Configure Android widget with provided template